<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="360" height="84" role="img" aria-label="DmitryWeb">
  <title>DmitryWeb</title>
  <defs>
    <linearGradient id="dw-glass" x1="22" y1="10" x2="42" y2="66" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0)">
      <stop offset="0" stop-color="#FF6A87"/>
      <stop offset=".45" stop-color="#E01F4E"/>
      <stop offset="1" stop-color="#A6082F"/>
    </linearGradient>
    <linearGradient id="dw-plate" x1="32" y1="6" x2="32" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33363D"/>
      <stop offset="1" stop-color="#202227"/>
    </linearGradient>
    <linearGradient id="dw-word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFBFC"/>
      <stop offset="1" stop-color="#D3D5DB"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(8 6) scale(1.125)">
    <rect width="64" height="64" rx="15" fill="url(#dw-plate)"/>
    <rect x=".6" y=".6" width="62.8" height="62.8" rx="14.4" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="1.2"/>
    <rect x="20" y="11" width="13.4" height="38.6" fill="url(#dw-glass)"/>
    <rect x="18" y="15.2" width="4" height="32.8" rx="2" fill="#FFFFFF" fill-opacity=".18"/>
    <path d="M30 18.15 H31.7 A13.85 13.85 0 0 1 31.7 45.85 H30" fill="none" stroke="#F7F7F9" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="43.4" r="1.8" fill="#FF8AA0"/>
  </g>

  <!-- wordmark -->
  <text x="94" y="46" font-family="Inter, 'Segoe UI', system-ui, Arial, sans-serif" font-size="29" font-weight="500" letter-spacing="-0.6" fill="url(#dw-word)">Dmitry</text>
  <text x="200" y="46" font-family="Inter, 'Segoe UI', system-ui, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.9" fill="#F0537A">Web</text>
  <text x="95" y="67" font-family="Inter, 'Segoe UI', system-ui, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.1" fill="#8E929C">TERMINBUCHUNG</text>
</svg>
